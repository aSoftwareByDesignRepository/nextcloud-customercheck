	<path fill="#ffffff" fill-rule="evenodd" d="M8 2a2 2 0 0 0-2 2v18h12V4a2 2 0 0 0-2-2H8ZM9.5 14.8l-2-2-1.4 1.4 3.4 3.4 7-7-1.4-1.4-5.6 5.6z"/>
	<path fill="#ffffff" d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2V12z"/>
	<path fill="#ffffff" d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2V9z"/>
</svg>
