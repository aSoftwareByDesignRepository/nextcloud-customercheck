  CustomerCheck white glyph for Nextcloud header / app menu / navigation entry.
  Motif matches in-app Lucide building-2 (customers). The check is an evenodd
  cutout so the header colour shows through the tick on every theme.
  White fills only so Nextcloud invert filters keep the glyph visible.
  XML comments must not contain double-hyphen (breaks strict SVG parsers).
-->
